<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reserve a Space · Escondido World Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ---------- search ---------- */
    .hero { text-align: center; padding: 30px 0 6px; }
    .hero h1 { font-size: 2.4rem; }
    .searchbar {
      position: relative; margin: 24px auto 0; max-width: 720px;
      display: grid; grid-template-columns: 1fr 1fr auto; align-items: stretch;
      background: #fff; border: 1px solid var(--line); border-radius: 999px; box-shadow: 0 8px 30px rgba(0,0,0,.08); padding: 6px;
    }
    .sfield { text-align: left; padding: 10px 26px; border-radius: 999px; cursor: pointer; border: 0; background: transparent; font: inherit; color: inherit; position: relative; }
    .sfield:hover, .sfield.on { background: #f3f1ec; }
    .sfield + .sfield::before { content: ""; position: absolute; left: 0; top: 22%; height: 56%; width: 1px; background: var(--line); }
    .sfield .k { font-size: .78rem; font-weight: 700; }
    .sfield .v { color: var(--muted); font-size: 1.02rem; white-space: nowrap; }
    .sfield .v.set { color: var(--ink); font-weight: 600; }
    .sgo { border-radius: 999px; min-height: 60px; padding: 0 28px; font-size: 1.05rem; }
    .openday { margin-top: 14px; color: var(--muted); font-size: .9rem; }
    .openday b { color: var(--ink); }

    /* ---------- calendar popover ---------- */
    .pop { position: absolute; top: calc(100% + 12px); left: 50%; transform: translateX(-50%); width: min(800px, 96vw); background: #fff; border-radius: 26px; box-shadow: 0 20px 60px rgba(0,0,0,.16); padding: 24px; z-index: 30; text-align: left; animation: pop .16s ease-out; }
    @keyframes pop { from { opacity: 0; transform: translate(-50%, -6px); } }
    .pop-h { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .months { display: grid; grid-template-columns: 1fr 1fr; gap: 34px; }
    .mname { text-align: center; font-weight: 700; margin-bottom: 10px; }
    .wk, .days { display: grid; grid-template-columns: repeat(7, 1fr); }
    .wk span { text-align: center; font-size: .75rem; font-weight: 700; color: #c9c4b9; padding-bottom: 6px; }
    .wk span.open { color: var(--ink); }
    .days > * { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .cell { position: relative; }
    .cell.inr::before { content: ""; position: absolute; inset: 14% 0; background: var(--accent-soft); z-index: 0; }
    .cell.rs::before { left: 50%; } .cell.re::before { right: 50%; } .cell.rs.re::before { display: none; }
    .off { color: #cfcabf; font-size: .9rem; position: relative; z-index: 1; }
    .dc { width: 100%; height: 100%; border: 0; background: transparent; font: inherit; border-radius: 50%; cursor: pointer; position: relative; z-index: 1; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .dc .dn { font-weight: 700; font-size: 1rem; line-height: 1; }
    .dc .lf { font-size: .6rem; color: var(--green); font-weight: 700; margin-top: 3px; }
    .dc .lf.low { color: var(--amber); }
    .dc:hover { box-shadow: inset 0 0 0 2px var(--ink); }
    .dc.end { background: var(--ink); color: #fff; } .dc.end .lf { color: #fff; opacity: .8; }
    .navb { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 1.1rem; }
    .navb:disabled { opacity: .3; cursor: default; }
    .pop-f { display: flex; gap: 12px; align-items: center; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }

    /* ---------- results (same page) ---------- */
    #results { margin-top: 34px; scroll-margin-top: 80px; }
    .rbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 14px 18px; box-shadow: var(--shadow); margin-bottom: 18px; }
    .daychips .chip { min-height: 40px; padding: 0 14px; }
    .daychips .chip .n { opacity: .65; font-weight: 600; margin-left: 4px; }
    .layout { display: grid; grid-template-columns: 1fr 360px; gap: 22px; align-items: start; }
    .side { position: sticky; top: 84px; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .85rem; }
    .legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 5px; }
    .map { background: #fbfaf7; border: 1px dashed #d8d3c7; border-radius: 18px; padding: 20px; margin-top: 14px; }
    .block { margin-bottom: 16px; }
    .block-label { font-size: .76rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px 2px; }
    .srow { display: grid; grid-template-columns: 24px repeat(14, 1fr); gap: 6px; align-items: center; }
    .rl { font-weight: 700; color: var(--muted); font-size: .85rem; }
    .aisle { height: 20px; margin: 6px 0 6px 30px; border-radius: 6px; background: repeating-linear-gradient(90deg, #ebe7de 0 14px, transparent 14px 22px); }
    .sp { position: relative; aspect-ratio: 1; min-height: 38px; border-radius: 9px; border: 2px solid transparent; font: inherit; font-size: .72rem; font-weight: 700; cursor: pointer; color: #2b2a26; transition: transform .08s, box-shadow .15s; }
    .sp:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,.12); }
    .sp.premium { background: var(--premium); } .sp.shaded { background: var(--shaded); } .sp.open { background: var(--open); }
    .sp:disabled { background: repeating-linear-gradient(45deg, #e9e6df 0 6px, #f3f1ec 6px 12px); color: #b5b0a5; cursor: not-allowed; }
    .sp.sel { background: var(--ink); color: #fff; transform: scale(1.1); box-shadow: 0 0 0 4px var(--accent-soft); }
    .sp .bolt { position: absolute; top: 1px; right: 3px; font-size: .6rem; }
    .landmarks { display: flex; gap: 10px; margin-top: 8px; }
    .lm { flex: 1; padding: 12px; border-radius: 12px; background: #efece5; text-align: center; font-weight: 600; color: var(--muted); font-size: .86rem; }
    .lm.gate { background: var(--accent); color: #fff; flex: 2; }
    .line { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; font-size: .93rem; }
    .total { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 12px; font-size: 1.35rem; font-weight: 700; }
    .toggle { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; margin-top: 12px; }
    .toggle input { width: 22px; height: 22px; accent-color: var(--accent); }
    .empty { text-align: center; padding: 30px; color: var(--muted); }

    @media (max-width: 1000px) {
      .searchbar { grid-template-columns: 1fr 1fr; border-radius: 24px; }
      .sgo { grid-column: 1 / -1; }
      .months { grid-template-columns: 1fr; } .months > :nth-child(2) { display: none; }
      .layout { grid-template-columns: 1fr; } .side { position: static; }
      .srow { grid-template-columns: 18px repeat(14, 1fr); gap: 3px; }
      .sp { min-height: 24px; font-size: .55rem; border-radius: 6px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html"><span class="dot">EW</span>Escondido World Marketplace</a>
    <nav id="nav" data-on="booking"></nav>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>Find your space</h1>
      <p class="muted" style="font-size:1.1rem">Choose your dates, then pick your spot on the map.</p>
      <div class="searchbar" id="sbar">
        <button class="sfield" id="fFrom"><div class="k">From</div><div class="v" id="vFrom">Add date</div></button>
        <button class="sfield" id="fTo"><div class="k">To</div><div class="v" id="vTo">Add date</div></button>
        <button class="btn primary sgo" id="go">🔎 See spaces</button>
        <div class="pop hidden" id="pop"></div>
      </div>
      <p class="openday">Open <b>Wed</b> 6am–3pm · <b>Fri</b> 2pm–10pm · <b>Sat</b> 7am–3pm · <b>Sun</b> 6am–3:30pm</p>
    </section>

    <section id="results" class="hidden">
      <div class="rbar">
        <div style="flex:1;min-width:220px"><b id="rTitle"></b><div class="small muted" id="rSub"></div></div>
        <div class="chips daychips" id="daychips"></div>
      </div>
      <div class="layout">
        <div class="card">
          <div class="row">
            <h3 style="margin:0">Tap a space</h3><span class="badge green" id="freeCount"></span>
            <span class="spacer"></span><div class="legend" id="legend"></div>
          </div>
          <div class="map" id="map"></div>
        </div>
        <aside class="side card" id="summary"></aside>
      </div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="booking.js"></script>
</body>
</html>
