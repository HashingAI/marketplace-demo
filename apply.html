<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Application · Escondido World Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <style>
    .shell { max-width: 680px; margin: 0 auto; }
    .stepper { display: flex; gap: 6px; margin: 4px 0 22px; }
    .stepper div { flex: 1; }
    .stepper .bar { height: 6px; border-radius: 6px; background: var(--line); }
    .stepper .on .bar { background: var(--accent); }
    .stepper .lbl { font-size: .72rem; color: var(--muted); margin-top: 6px; font-weight: 600; }
    .stepper .on .lbl { color: var(--ink); }

    .cart { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 14px; background: var(--accent-soft); margin-bottom: 18px; }
    .cart .code { font-size: 1.4rem; font-weight: 700; background: var(--ink); color: #fff; border-radius: 10px; padding: 8px 12px; }

    .demo { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1.5px dashed #c9b9f0; background: #f5f1ff; border-radius: 12px; margin-bottom: 16px; color: #5b3fb5; font-size: .9rem; font-weight: 600; }
    .demo .btn { border-color: #b9a6ee; color: #5b3fb5; }

    .sec { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
    .sec:first-of-type { border-top: 0; padding-top: 0; margin-top: 8px; }
    .sec-t { font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .why { font-size: .8rem; color: var(--muted); margin-top: 4px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .two label.f { margin-top: 14px; }
    textarea.in { min-height: 90px; padding: 12px 14px; resize: vertical; font: inherit; }
    .chips .chip { min-height: 42px; }
    .req { color: var(--accent); }
    .ack { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; margin-top: 10px; cursor: pointer; font-size: .93rem; }
    .ack input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; margin-top: 1px; }

    .sso { display: grid; gap: 12px; }
    .sso .btn { justify-content: flex-start; padding-left: 20px; }
    .or { text-align: center; color: var(--muted); margin: 18px 0 4px; font-size: .9rem; }

    .doc { display: flex; gap: 14px; align-items: flex-start; padding: 16px; border: 1.5px solid var(--line); border-radius: 14px; margin-bottom: 12px; }
    .doc.done { border-color: var(--green); background: var(--green-soft); }
    .doc.skip { opacity: .55; }
    .doc .ic { font-size: 1.6rem; width: 40px; text-align: center; }
    .doc .body { flex: 1; min-width: 0; }
    .doc .fn { font-size: .85rem; color: var(--green); font-weight: 600; margin-top: 4px; }
    .doc input[type=file] { display: none; }
    .doc .src { font-size: .78rem; margin-top: 4px; }
    .doc .src a { color: var(--muted); }

    .pay-opt { display: grid; gap: 12px; }
    .apple { background: #000; color: #fff; border-color: #000; font-size: 1.1rem; }

    .done-hero { text-align: center; }
    .check { width: 72px; height: 72px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; font-size: 2.2rem; margin: 0 auto 14px; animation: popin .35s cubic-bezier(.2, 1.6, .5, 1); }
    @keyframes popin { from { transform: scale(.3); opacity: 0; } }
    .qr { display: inline-block; padding: 14px; background: #fff; border: 1px solid var(--line); border-radius: 14px; margin: 10px 0; }
    .qr svg { display: block; }
    .wallets { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 14px; }
    .wallets .btn { min-height: 52px; font-size: .92rem; }
    .w-apple { background: #000; color: #fff; border-color: #000; }

    .sent { display: grid; gap: 10px; margin-top: 22px; }
    .sent-row { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 12px; background: #f7f6f2; cursor: pointer; border: 1.5px solid transparent; }
    .sent-row:hover, .sent-row.on { border-color: var(--line); background: #fff; }
    .sent-row .st { margin-left: auto; color: var(--green); font-weight: 700; font-size: .85rem; white-space: nowrap; }
    .sent-row .ic { font-size: 1.4rem; }

    .preview { margin-top: 12px; }
    .phone { width: 300px; margin: 0 auto; background: #111; border-radius: 40px; padding: 12px; box-shadow: 0 20px 50px rgba(0,0,0,.2); }
    .screen { background: #f2f2f7; border-radius: 30px; padding: 18px 12px 22px; min-height: 360px; font-family: -apple-system, system-ui, sans-serif; }
    .notch { width: 90px; height: 22px; background: #111; border-radius: 0 0 14px 14px; margin: -18px auto 12px; }
    .push { background: rgba(255,255,255,.9); border-radius: 16px; padding: 10px 12px; font-size: .78rem; box-shadow: 0 4px 14px rgba(0,0,0,.08); margin-bottom: 14px; animation: slide .4s ease-out; }
    @keyframes slide { from { transform: translateY(-20px); opacity: 0; } }
    .push b { font-size: .8rem; }
    .bubble { background: #e5e5ea; color: #000; border-radius: 18px; padding: 10px 13px; font-size: .82rem; line-height: 1.35; max-width: 88%; margin-bottom: 6px; }
    .bubble a { color: #0a66d6; }
    .from { text-align: center; font-size: .7rem; color: #8e8e93; margin-bottom: 10px; }

    .mail { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #fff; }
    .mail-h { padding: 12px 16px; background: #f7f6f2; font-size: .85rem; border-bottom: 1px solid var(--line); }
    .mail-b { padding: 22px; }
    .mail-b .mbar { height: 6px; background: var(--accent); border-radius: 4px; margin-bottom: 18px; width: 60px; }
    .mail table { width: 100%; font-size: .9rem; border-collapse: collapse; margin: 12px 0; }
    .mail td { padding: 6px 0; border-bottom: 1px solid #f0eee9; }
    .mail td:last-child { text-align: right; font-weight: 600; }

    .pass { width: 300px; margin: 0 auto; border-radius: 18px; background: linear-gradient(160deg, #e2572b, #b83a15); color: #fff; padding: 18px; box-shadow: 0 16px 40px rgba(184,58,21,.35); animation: popin .35s ease-out; }
    .pass .lbl { font-size: .62rem; text-transform: uppercase; letter-spacing: .08em; opacity: .75; }
    .pass .val { font-weight: 700; font-size: 1.05rem; }
    .pass .qrb { background: #fff; border-radius: 10px; padding: 10px; margin: 16px auto 4px; width: fit-content; }

    .timeline { list-style: none; padding: 0; margin: 22px 0 0; text-align: left; }
    .timeline li { display: flex; gap: 14px; padding: 0 0 16px; position: relative; }
    .timeline li:not(:last-child)::before { content: ""; position: absolute; left: 13px; top: 28px; bottom: 0; width: 2px; background: var(--line); }
    .timeline .b { width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: .8rem; font-weight: 700; background: var(--line); color: var(--muted); }
    .timeline .ok .b { background: var(--green); color: #fff; }
    .timeline .now .b { background: var(--amber); color: #fff; }
    .timeline .now .tt { color: var(--amber); }
    .timeline .tt { font-weight: 700; }

    @media (max-width: 640px) { .two, .wallets { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html"><span class="dot">EW</span>Escondido World Marketplace</a>
    <nav id="nav" data-on="booking"></nav>
  </header>

  <main class="wrap">
    <div class="shell">
      <div class="stepper" id="stepper"></div>
      <div id="cartBox"></div>
      <section class="card" id="panel"></section>
    </div>
  </main>

  <script src="data.js"></script>
  <script src="apply.js"></script>
</body>
</html>
